name: 'Nightly Data Update'
on:
  workflow_dispatch:
  schedule:
    - cron: '00 9 * * *' # once a day at 9:00 AM UTC / 1:00 AM PST
  
jobs:
  # Update the event information in case it has changed.
  load_event_info:
    name: Update Event Data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./apps/greyscout/util
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.10'
          enable-cache: true
          cache-dependency-glob: 'apps/greyscout/util/uv.lock'

      - run: uv sync --locked

      - name: Update team data
        env:
          TBA_CREDENTIALS: ${{ secrets.TBA_CREDENTIALS }}
          SUPABASE_CREDENTIALS: ${{ secrets.SUPABASE_CREDENTIALS }}
        run: uv run python main.py --mode=event --tba_creds="$TBA_CREDENTIALS" --supabase_creds="$SUPABASE_CREDENTIALS"
