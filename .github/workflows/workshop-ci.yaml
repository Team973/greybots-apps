name: Workshop CI

on:
  pull_request:
    paths:
      - 'apps/workshop/**'
      - 'packages/common/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/workshop-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'apps/workshop/**'
      - 'packages/common/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:workshop
